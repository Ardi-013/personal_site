<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Диана | Персональный сайт</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#24170d] text-stone-800 m-0 p-0 min-h-screen select-none overflow-x-hidden">

  <main class="relative w-full min-h-screen cork-frame p-4 sm:p-8 md:p-12 shadow-2xl flex flex-col justify-between overflow-hidden" id="cork-board">
    
    <div class="brass-corner top-0 left-0"></div>
    <div class="brass-corner top-0 right-0 rotate-90"></div>
    <div class="brass-corner bottom-0 left-0 -rotate-90"></div>
    <div class="brass-corner bottom-0 right-0 rotate-180"></div>

    <!-- Слой со стикерами лежит позади карточек -->
    <div id="sticker-layer" class="absolute inset-0 pointer-events-none z-[5]"></div>

    <header class="relative z-20 flex flex-wrap items-start justify-between gap-4 mb-6 sm:mb-8">
      
      <div class="paper-badge bg-white p-3 pt-4 rounded-sm shadow-md border-b-2 border-r-2 border-stone-300 rotate-[-2deg] flex items-center gap-3">
        <div class="pushpin pin-red"></div>
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-200 to-rose-200 flex items-center justify-center text-xl shadow-xs">
          👩‍💻
        </div>
        <div>
          <div class="font-bold text-sm text-stone-900 leading-tight">Диана</div>
          <div class="text-[11px] text-stone-600">Студентка ДВФУ</div>
          <span class="inline-block mt-0.5 px-1.5 py-0.5 bg-amber-100 text-amber-900 font-mono text-[10px] rounded">ardi013.ru</span>
        </div>
      </div>

      <div class="paper-badge bg-[#fffef0] px-3 py-2.5 rounded-sm shadow-md border-b-2 border-r-2 border-amber-200/90 rotate-[0.8deg] flex items-center gap-2">
        <div class="washi-tape"></div>
        <button id="pointer-btn" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-white transition flex items-center gap-1 shadow-xs">
          <span>👆</span>
          <span class="hidden sm:inline">Просмотр</span>
        </button>
        <div class="h-4 w-px bg-amber-300 mx-0.5"></div>
        <div class="flex items-center gap-0.5 sm:gap-1">
          <button class="sticker-btn p-1 text-lg hover:scale-125 active:scale-95 transition" data-sticker="❤️">❤️</button>
          <button class="sticker-btn p-1 text-lg hover:scale-125 active:scale-95 transition" data-sticker="⭐">⭐</button>
          <button class="sticker-btn p-1 text-lg hover:scale-125 active:scale-95 transition" data-sticker="🌸">🌸</button>
          <button class="sticker-btn p-1 text-lg hover:scale-125 active:scale-95 transition" data-sticker="🐾">🐾</button>
          <button class="sticker-btn p-1 text-lg hover:scale-125 active:scale-95 transition" data-sticker="☕">☕</button>
          <button class="sticker-btn p-1 text-lg hover:scale-125 active:scale-95 transition" data-sticker="✨">✨</button>
        </div>
        <div class="h-4 w-px bg-amber-300 mx-0.5"></div>
        <button id="clear-stickers-btn" class="p-1 text-xs text-stone-500 hover:text-red-600 transition" title="Очистить доску">
          🗑️ (<span id="sticker-count">0</span>)
        </button>
      </div>

    </header>

    <!-- Сетка 6 колонок: 3 карточки сверху и 2 центрированные снизу под промежутками -->
    <div class="relative z-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-y-16 sm:gap-y-20 gap-x-8 lg:gap-x-10 justify-items-center items-center my-auto py-4 px-2 sm:px-6">

      <!-- Карточка 1 (Верхний ряд, лево) -->
      <div class="board-card lg:col-span-2 bg-[#fff9b0] p-5 rounded-sm shadow-lg border-b-2 border-r-2 border-amber-300/80 rotate-[-3deg] md:-translate-y-2 md:translate-x-2">
        <div class="washi-tape"></div>
        <h3 class="font-bold text-amber-950 text-sm flex items-center gap-1.5 mb-3 mt-1">
          <span>🎯</span> План на лабу ТРПО
        </h3>
        <div class="flex items-center justify-between pt-2.5 border-t border-amber-300/70 text-[11px] text-amber-900/80 font-medium">
          <span class="paper-tag bg-amber-200/80 text-amber-950">GitHub Pages</span>
          <span class="paper-tag bg-amber-200/80 text-amber-950">Let's Encrypt</span>
        </div>

        <!-- Бумажка 1 (справа) -->
        <div class="hover-note note-r bg-[#fffef0] border-amber-200">
          <div class="washi-tape"></div>
        </div>
        <!-- Бумажка 2 (снизу) -->
        <div class="hover-note note-b bg-[#fffcf0] border-amber-200">
          <div class="pushpin pin-gold"></div>
        </div>
      </div>

      <!-- Карточка 2 (Верхний ряд, центр) -->
      <div class="board-card lg:col-span-2 bg-[#ffd6e0] p-5 rounded-sm shadow-lg border-b-2 border-r-2 border-rose-300 rotate-[2.5deg] md:translate-y-3">
        <div class="pushpin pin-gold"></div>
        <h3 class="font-bold text-rose-950 text-sm flex items-center gap-1.5 mb-2 mt-1">
          <span>🌸</span> Чем увлекаюсь
        </h3>

        <!-- Бумажка 1 (слева) -->
        <div class="hover-note note-l bg-[#fff5f7] border-rose-200">
          <div class="washi-tape"></div>
        </div>
        <!-- Бумажка 2 (справа) -->
        <div class="hover-note note-r bg-[#ffeef2] border-rose-200">
          <div class="pushpin pin-red"></div>
        </div>
      </div>

      <!-- Карточка 3 (Верхний ряд, право) -->
      <div class="board-card lg:col-span-2 bg-[#dcfce7] p-5 rounded-sm shadow-lg border-b-2 border-r-2 border-emerald-300 rotate-[-3.5deg] md:-translate-y-3 md:-translate-x-2">
        <div class="pushpin pin-green"></div>
        <h3 class="font-bold text-emerald-950 text-sm flex items-center gap-1.5 mb-2.5 mt-1">
          <span>💻</span> Мой стек технологий
        </h3>

        <!-- Бумажка 1 (слева) -->
        <div class="hover-note note-l bg-[#f2fdf6] border-emerald-200">
          <div class="pushpin pin-green"></div>
        </div>
        <!-- Бумажка 2 (снизу) -->
        <div class="hover-note note-b bg-[#ecfdf5] border-emerald-200">
          <div class="washi-tape"></div>
        </div>
      </div>

      <!-- Карточка 4 (Нижний ряд, центр-лево под промежутком 1 и 2) -->
      <div class="board-card lg:col-start-2 lg:col-span-2 bg-[#e0f2fe] p-5 rounded-sm shadow-lg border-b-2 border-r-2 border-sky-300 rotate-[3.5deg] md:translate-y-2">
        <div class="washi-tape washi-tape-cyan"></div>
        <div class="flex items-center justify-between mb-2 mt-1">
          <h3 class="font-bold text-sky-950 text-sm">personal_site</h3>
          <span class="paper-tag bg-sky-200 text-sky-900 font-mono text-[10px]">v1.0</span>
        </div>
        <div class="pt-2.5 border-t border-sky-300/60 flex items-center justify-between">
          <a href="https://github.com/Ardi-013/personal_site" target="_blank" class="paper-tag bg-white hover:bg-sky-50 text-sky-950 font-semibold shadow-xs flex items-center gap-1 transition">
            <span>Репозиторий</span> <span>→</span>
          </a>
          <span class="text-[10px] text-sky-800 font-mono">Tailwind</span>
        </div>

        <!-- Бумажка 1 (сверху в карман между карточками 1 и 2) -->
        <div class="hover-note note-t bg-[#f0f9ff] border-sky-200">
          <div class="pushpin pin-blue"></div>
        </div>
        <!-- Бумажка 2 (справа) -->
        <div class="hover-note note-r bg-[#e0f2fe]/90 border-sky-200">
          <div class="washi-tape washi-tape-cyan"></div>
        </div>
      </div>

      <!-- Карточка 5 (Нижний ряд, центр-право под промежутком 2 и 3) -->
      <div class="board-card lg:col-start-4 lg:col-span-2 bg-[#f3e8ff] p-5 rounded-sm shadow-lg border-b-2 border-r-2 border-purple-300 rotate-[-2.5deg] md:-translate-y-1">
        <div class="pushpin pin-blue"></div>
        <div class="flex items-center justify-between mb-2 mt-1">
          <h3 class="font-bold text-purple-950 text-sm">Лабораторные ТРПО</h3>
          <span class="paper-tag bg-purple-200 text-purple-900 font-mono text-[10px]">ДВФУ</span>
        </div>
        <div class="pt-2.5 border-t border-purple-300/60 flex items-center justify-between">
          <a href="https://github.com/Ardi-013/polumecenev" target="_blank" class="paper-tag bg-white hover:bg-purple-50 text-purple-950 font-semibold shadow-xs flex items-center gap-1 transition">
            <span>Репозиторий</span> <span>→</span>
          </a>
          <span class="text-[10px] text-purple-800 font-mono">C++ / Python</span>
        </div>

        <!-- Бумажка 1 (сверху в карман между карточками 2 и 3) -->
        <div class="hover-note note-t bg-[#faf5ff] border-purple-200">
          <div class="pushpin pin-gold"></div>
        </div>
        <!-- Бумажка 2 (слева) -->
        <div class="hover-note note-l bg-[#f5f3ff] border-purple-200">
          <div class="washi-tape"></div>
        </div>
      </div>

    </div>

    <footer class="relative z-20 pt-4 border-t border-amber-950/20 flex flex-wrap items-center justify-between gap-3 text-xs mt-6">
      <div class="flex flex-wrap items-center gap-2">
        <span class="paper-tag bg-amber-100/90 text-amber-950 font-semibold">📬 Связаться:</span>
        <a href="https://t.me" target="_blank" class="paper-tag bg-white hover:bg-stone-50 text-stone-800 font-semibold shadow-xs transition">Telegram</a>
        <a href="https://github.com/Ardi-013" target="_blank" class="paper-tag bg-white hover:bg-stone-50 text-stone-800 font-semibold shadow-xs transition">GitHub</a>
        <a href="mailto:contact@ardi013.ru" target="_blank" class="paper-tag bg-white hover:bg-stone-50 text-stone-800 font-semibold shadow-xs transition">Email</a>
      </div>
      <div class="text-[11px] text-amber-950/80 font-medium font-mono">
        © 2026 Диана • ardi013.ru
      </div>
    </footer>
  </main>

  <div id="ghost-sticker" class="fixed pointer-events-none text-3xl z-50 select-none hidden" style="transform: translate(0, 0);"></div>

  <script src="js/main.js?v=6"></script>
</body>
</html>
